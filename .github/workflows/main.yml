name: Parrot OS + Windows RDP (mstsc)

on:
  workflow_dispatch:

jobs:
  parrot-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Start Parrot OS with XRDP
        run: |
          docker run -d \
            --name parrot-box \
            --network host \
            parrotsec/security:latest \
            bash -c "apt-get update && \
            DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-goodies xrdp dbus-x11 python3 python3-pip git && \
            echo 'root:MR.English2008' | chpasswd && \
            echo 'xfce4-session' > /root/.xsession && \
            sed -i 's/3389/3390/g' /etc/xrdp/xrdp.ini && \
            service dbus start && \
            service xrdp start && \
            tail -f /dev/null"

      - name: Expose RDP Port via Pinggy Tunnel
        run: |
          # إنشاء نفق TCP مباشر لبورت 3390 بدون الحاجة لحساب
          ssh -o StrictHostKeyChecking=no -p 443 -R0:localhost:3390 tcp@a.pinggy.io > pinggy.log 2>&1 &
          sleep 10
          
          echo "=========================================================="
          echo "=== انسخ العنوان بالبورت وحطه في Remote Desktop Connection ==="
          grep -o 'tcp://[a-zA-Z0-9.-]*:[0-9]*' pinggy.log | head -n 1
          echo "Username : root"
          echo "Password : MR.English2008"
          echo "=========================================================="

      - name: Keep Alive
        run: |
          while true; do
            echo "[$(date +%T)] Parrot OS RDP Active"
            sleep 300
          done
